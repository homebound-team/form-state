version: 2.1

orbs:
  node: circleci/node@5.1.0

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context:
            - npm-readonly
      - publish:
          context:
            - npm-trusted-publish
            - npm-readonly
            - github
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    docker:
      - image: cimg/node:26.8.1
    working_directory: ~/project
    steps:
      - checkout
      - run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
      - node/install-packages:
          pkg-manager: yarn-berry
      - run: npm run build
      - run: yarn typecheck
      - run: yarn lint --quiet
      - run: npm test

  publish:
    docker:
      - image: cimg/node:26.8.1
    working_directory: ~/project
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn-berry
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            npm run semantic-release
